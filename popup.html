<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Случайный бейдж</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #18181b;
      color: #efeff1;
    }

    .header {
      background: #9147ff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header h1 {
      font-size: 14px;
      font-weight: 600;
    }

    .header .version {
      font-size: 11px;
      opacity: 0.7;
    }

    .content {
      padding: 16px;
    }

    .toggle-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #2f2f35;
      border-radius: 8px;
    }

    .toggle-section .label {
      font-size: 13px;
      font-weight: 500;
    }

    .toggle {
      position: relative;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle .slider {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #53535f;
      border-radius: 24px;
      transition: 0.3s;
    }

    .toggle .slider:before {
      content: '';
      position: absolute;
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }

    .toggle input:checked + .slider {
      background: #9147ff;
    }

    .toggle input:checked + .slider:before {
      transform: translateX(20px);
    }

    .status {
      margin-top: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
    }

    .status.active {
      background: rgba(30, 207, 103, 0.15);
      color: #1ecf67;
    }

    .status.inactive {
      background: rgba(245, 99, 99, 0.15);
      color: #f56363;
    }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid #2f2f35;
      font-size: 10px;
      color: #adadb8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">&#127922;</span>
    <div>
      <h1>Twitch Random Badge</h1>
      <div class="version">v1.0.0</div>
    </div>
  </div>

  <div class="content">
    <div class="toggle-section">
      <span class="label">Расширение включено</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-section" style="margin-top: 8px;">
      <span class="label">Последовательный режим</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-sequential">
        <span class="slider"></span>
      </label>
    </div>

    <div class="status" id="status">Проверка...</div>
  </div>

  <div class="footer">
    Twitch Random Badge Extension
  </div>

  <script src="popup.js"></script>
</body>
</html>
